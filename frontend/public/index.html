<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090A0F" />
    <meta name="description" content="CollabLance — Dark Obsidian Freelancing Platform. Connect with world-class talent, manage projects, and build teams." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

    <title>CollabLance | Freelancing Platform</title>

    <style>
      /* Critical inline styles — prevents FOUC before React mounts */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #090A0F;
        color: #F9FAFB;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        display: flex;
        min-height: 100vh;
        background: #090A0F;
      }
      /* Prevent white flash */
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #090A0F;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
